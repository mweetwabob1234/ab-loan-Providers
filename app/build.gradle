plugins { id 'com.android.application' }

android {
    namespace 'zm.ablender.loanbook'
    compileSdk 34

    defaultConfig {
        applicationId "zm.ablender.loanbook"
        minSdk 23
        targetSdk 34
        // CI passes -PversionCode/-PversionName so every build from GitHub
        // Actions has a strictly increasing versionCode (the in-app updater
        // compares against this). Local builds fall back to 1 / "1.0".
        versionCode (project.hasProperty('versionCode') ? (project.property('versionCode') as Integer) : 1)
        versionName (project.hasProperty('versionName') ? project.property('versionName') : "1.0")
    }

    signingConfigs {
        debug {
            // Pinned to a keystore checked into the repo (app/debug.keystore)
            // instead of the machine-local ~/.android/debug.keystore, which
            // GitHub Actions would otherwise regenerate randomly on every
            // run. A stable signing key is required for Android to treat a
            // downloaded update as an in-place upgrade (preserving app data)
            // rather than a signature-mismatched install it must reject.
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the (pinned) debug key so the APK installs by
            // sideloading with no keystore setup. Replace before any Play
            // Store upload.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
