plugins { id 'com.android.application' }

android {
    namespace 'zm.ablender.loanbook'
    compileSdk 34

    defaultConfig {
        applicationId "zm.ablender.loanbook"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs by sideloading
            // with no keystore setup. Replace before any Play Store upload.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
